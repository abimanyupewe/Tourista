<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat bot</title>

    <link rel="stylesheet" href="Custom-css/custom-css.css" />

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- bootstrap end -->

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <!-- font end -->

    <!-- icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- icons end -->
  </head>
  <style>
    * {
      font-family: "K2D";
    }
  </style>
  <body>
    <a href="index.html" class="d-flex text-black fs-3 p-3">Tourista</a>
    <section id="chatbot" class="container py-5">
        <div class="row justify-content-center">
          <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
              <!-- Header Chatbot -->
              <div class="card-header bg-primary text-white rounded-top-4 d-flex align-items-center justify-content-between">
                <h5 class="mb-0">Chat Booby</h5>
                <span class="badge bg-light text-primary">Online</span>
              </div>
      
              <!-- Body Chat -->
              <div class="card-body chat-body overflow-auto" style="height: 400px; background-color: #f9f9f9;">
                <!-- Contoh Pesan -->
                <div class="d-flex flex-column">
                  <!-- Pesan dari Booby -->
                  <div class="d-flex mb-3">
                    <div class="bg-light border rounded-3 p-3">
                      <strong>Booby:</strong>
                      <p class="mb-0">Halo! Ada yang bisa saya bantu?</p>
                    </div>
                  </div>
      
                  <!-- Pesan dari Pengguna -->
                  <div class="d-flex justify-content-end mb-3">
                    <div class="bg-primary text-white rounded-3 p-3">
                      <p class="mb-0">Hai Booby! Apa kabar?</p>
                    </div>
                  </div>
      
                  <!-- Pesan Tambahan -->
                  <div class="d-flex mb-3">
                    <div class="bg-light border rounded-3 p-3">
                      <strong>Booby:</strong>
                      <p class="mb-0">Saya baik, terima kasih! Apa yang bisa saya bantu?</p>
                    </div>
                  </div>
                </div>
              </div>
      
              <!-- Footer Input -->
              <div class="card-footer p-3 bg-white">
                <div class="input-group">
                  <input type="text" class="form-control rounded-start-pill" placeholder="Ketik pesan..." />
                  <button class="btn btn-primary rounded-end-pill" type="button">
                    <i class="bi bi-send"></i> Kirim
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>              

    <!-- icons -->
    <script>
      feather.replace();
    </script>
    <!-- icons end -->

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- bootstrap end -->
  </body>
</html>
