<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Booking</title>

    <link rel="stylesheet" href="Custom-css/custom-css.css" />

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- bootstrap end -->

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <!-- font end -->

    <!-- icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- icons end -->
  </head>
  <style>
    * {
      font-family: "K2D";
    }
  </style>
  <body>
    <section id="booking" class="p-3">
      <a href="index.html" class="d-flex text-black fs-3">Tourista</a>
      <h2 class="text-center mb-4 display-5 fw-bold text-primary">
        Pemesanan Tour dan Kamar
      </h2>
      <p class="text-center mb-5 text-muted">
        Isi form di bawah untuk memesan tour dan kamar. Kami akan mengonfirmasi pesanan Anda setelah menerima informasi lengkap Anda.
      </p>
      <div class="row justify-content-center">
        <div class="col-lg-10">
          <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
              <form>
                <div class="row">
                  <!-- Kolom Kiri -->
                  <div class="col-md-6">
                    <!-- Nama Lengkap -->
                    <div class="mb-4">
                      <label for="name" class="form-label">Nama Lengkap</label>
                      <input type="text" class="form-control rounded-3" id="name" placeholder="Masukkan nama lengkap" required />
                    </div>
    
                    <!-- Email -->
                    <div class="mb-4">
                      <label for="email" class="form-label">Email</label>
                      <input type="email" class="form-control rounded-3" id="email" placeholder="Masukkan alamat email" required />
                    </div>
    
                    <!-- Nomor Telepon -->
                    <div class="mb-4">
                      <label for="phone" class="form-label">Nomor Telepon</label>
                      <input type="tel" class="form-control rounded-3" id="phone" placeholder="Masukkan nomor telepon" required />
                    </div>
    
                    <!-- Pilihan Tour -->
                    <div class="mb-4">
                      <label for="tour" class="form-label">Pilih Tour</label>
                      <select class="form-select rounded-3" id="tour" required>
                        <option value="" disabled selected>Pilih tour yang ingin diikuti</option>
                        <option value="tour1">Tour 1 - Pantai Eksotik</option>
                        <option value="tour2">Tour 2 - Petualangan Gunung</option>
                        <option value="tour3">Tour 3 - Wisata Sejarah</option>
                      </select>
                    </div>
    
                    <!-- Tanggal Tour -->
                    <div class="mb-4">
                      <label for="tourDate" class="form-label">Tanggal Tour</label>
                      <input type="date" class="form-control rounded-3" id="tourDate" required />
                    </div>
                  </div>
    
                  <!-- Kolom Kanan -->
                  <div class="col-md-6">
                    <!-- Jumlah Orang -->
                    <div class="mb-4">
                      <label for="guests" class="form-label">Jumlah Orang</label>
                      <input type="number" class="form-control rounded-3" id="guests" placeholder="Masukkan jumlah orang" required />
                    </div>
    
                    <!-- Pilihan Kamar -->
                    <div class="mb-4">
                      <label for="room" class="form-label">Pilih Kamar</label>
                      <select class="form-select rounded-3" id="room" required>
                        <option value="" disabled selected>Pilih jenis kamar</option>
                        <option value="single">Kamar Single</option>
                        <option value="double">Kamar Double</option>
                        <option value="suite">Suite Room</option>
                      </select>
                    </div>
    
                    <!-- Tanggal Check-In -->
                    <div class="mb-4">
                      <label for="checkInDate" class="form-label">Tanggal Check-In</label>
                      <input type="date" class="form-control rounded-3" id="checkInDate" required />
                    </div>
    
                    <!-- Tanggal Check-Out -->
                    <div class="mb-4">
                      <label for="checkOutDate" class="form-label">Tanggal Check-Out</label>
                      <input type="date" class="form-control rounded-3" id="checkOutDate" required />
                    </div>
    
                    <!-- Pesan Tambahan -->
                    <div class="mb-4">
                      <label for="message" class="form-label">Pesan Tambahan</label>
                      <textarea class="form-control rounded-3" id="message" rows="3" placeholder="Masukkan pesan atau permintaan khusus (opsional)"></textarea>
                    </div>
                  </div>
                </div>
    
                <!-- Tombol Submit -->
                <div class="d-grid mt-4">
                  <button type="submit" class="btn btn-primary btn-lg rounded-3 fw-bold shadow-sm text-white">
                    Booking
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>        

    <!-- icons -->
    <script>
      feather.replace();
    </script>
    <!-- icons end -->

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- bootstrap end -->
  </body>
</html>
