<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register</title>

    <link rel="stylesheet" href="../Custom-css/register.css" />

    <!-- bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <!-- bootstrap end -->

    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=K2D:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
      rel="stylesheet"
    />
    <!-- font end -->

    <!-- icons -->
    <script src="https://unpkg.com/feather-icons"></script>
    <!-- icons end -->
  </head>
  <style>
    * {
      font-family: "K2D";
    }
  </style>
  <body>
    <section
      id="login"
      class="d-flex align-items-center justify-content-center bg-light"
    >
      <div class="container-fluid">
        <div class="row align-items-center">
          <!-- Image Section with background -->
          <div class="col-md-8 bg-image">
            <a href="../index.html" class="d-flex position-absolute text-white p-2 fs-4">Tourista</a>
          </div>
          <!-- Register Form Section -->
          <div class="col-md-4">
            <div class="card shadow p-4">
              <div class="card-body">
                <h2 class="text-center fw-bold mb-4">Welcome!</h2>
                <p class="text-center text-muted mb-4">
                  Register to begin your journey with Tourista
                </p>
                <!-- Register Form -->
                <form>
                  <div class="mb-3">
                    <label for="name" class="form-label">Full Name</label>
                    <input
                      type="text"
                      class="form-control"
                      id="name"
                      placeholder="Enter your full name"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="email" class="form-label">Email Address</label>
                    <input
                      type="email"
                      class="form-control"
                      id="email"
                      placeholder="Enter your email"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input
                      type="password"
                      class="form-control"
                      id="password"
                      placeholder="Enter your password"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label for="repassword" class="form-label"
                      >Re-enter Password</label
                    >
                    <input
                      type="password"
                      class="form-control"
                      id="repassword"
                      placeholder="Re-enter your password"
                      required
                    />
                  </div>
                  <div
                    class="d-flex justify-content-between align-items-center mb-4"
                  >
                    <div class="form-check">
                      <input
                        type="checkbox"
                        class="form-check-input"
                        id="rememberMe"
                      />
                      <label class="form-check-label" for="rememberMe"
                        >I agree to the terms and conditions</label
                      >
                    </div>
                  </div>
                  <div class="text-center text-muted mb-3">
                    <span>or register with your email</span>
                  </div>
                  <!-- Register with Google -->
                  <div class="d-grid gap-2 mb-4">
                    <button class="btn btn-outline-primary btn-lg">
                      Register with Google
                    </button>
                  </div>
                  <button type="submit" class="btn btn-primary w-100 btn-lg">
                    Register
                  </button>
                </form>
                <p class="text-center mt-4">
                  Already have an account?
                  <a href="login.html" class="text-primary text-decoration-none"
                    >Sign In</a
                  >
                </p>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- icons -->
    <script>
      feather.replace();
    </script>
    <!-- icons end -->

    <!-- bootstrap -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
    <!-- bootstrap end -->
  </body>
</html>
